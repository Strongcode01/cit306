{% extends 'core/base.html' %}
{% load static %}
{% block title %}Login{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/login.css' %}">
<style>
/* Background gradient */
body {
  background: linear-gradient(135deg, #f3e8ff 0%, #e0f7fa 100%);
}

/* Container */
.auth-container {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 3rem 1rem;
  border-radius: 10px solid grey;
}

/* Card form */
.auth-form {
  background: #ffffff;
  padding: 2.5rem 2rem;
  border-radius: 1rem;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  animation: fadeIn 0.8s ease;
}

/* Title */
.auth-form span {
  font-size: 1.8rem;
  font-weight: 700;
  color: #1f0030;
  text-align: center;
  margin-bottom: 0.5rem;
  display: block;
}

/* Input fields */
.auth-form input[type="text"],
.auth-form input[type="password"] {
  width: 100%;
  padding: 0.75rem 1rem;
  font-size: 0.95rem;
  border: 1px solid #ddd;
  border-radius: 8px;
  transition: all 0.25s ease;
}

.auth-form input:focus {
  border-color: #6a1b9a;
  box-shadow: 0 0 0 3px rgba(106, 27, 154, 0.1);
  outline: none;
}

/* Remember me checkbox */
.newsletter-section {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-top: 0.3rem;
}

.newsletter-section label {
  font-size: 0.9rem;
  color: #555;
  cursor: pointer;
}

.newsletter-section input[type="checkbox"] {
  accent-color: #6a1b9a;
}

/* Login button */
.auth-form button {
  background: linear-gradient(90deg, #6a1b9a, #8e24aa);
  color: white;
  font-weight: 600;
  border: none;
  border-radius: 8px;
  padding: 0.75rem;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.auth-form button:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(106, 27, 154, 0.2);
}

/* Error messages */
.form-errors {
  background: #ffebee;
  color: #b71c1c;
  font-size: 0.9rem;
  border-left: 4px solid #c62828;
  border-radius: 6px;
  padding: 0.5rem 0.75rem;
  list-style: none;
}

.form-errors li {
  margin: 0.25rem 0;
}

/* Animation */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Responsive design */
@media (max-width: 480px) {
  .auth-form {
    padding: 2rem 1.25rem;
  }
  .auth-form span {
    font-size: 1.5rem;
  }
}
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
  <form class="auth-form" method="post" novalidate>
    {% csrf_token %}
    <span>Login</span>

    <input type="text" name="username" placeholder="Matric number or username" required
           value="{{ form.username.value|default_if_none:'' }}">

    <input type="password" name="password" placeholder="Password" required>

    <div class="newsletter-section">
      <label>
        <input type="checkbox" name="remember" /> Remember me
      </label>
    </div>

    <button type="submit">Login</button>

    {% if form.non_field_errors %}
    <ul class="form-errors">
      {% for err in form.non_field_errors %}
        <li>{{ err }}</li>
      {% endfor %}
    </ul>
    {% endif %}
  </form>
</div>
{% endblock %}
