{% extends 'core/base.html' %}
{% load static %}
{% block title %}Update Profile{% endblock %}

{% block content %}
<section class="profile-section">
  <div class="profile-wrapper">
    <h2 class="profile-heading">Update Your Profile</h2>
    <p class="profile-subtext">
      Keep your information up to date to stay connected with the department.
    </p>
    <form method="post" enctype="multipart/form-data" class="profile-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-primary">Save Changes</button>
    </form>
  </div>
</section>

<style>
/* Section background */
.profile-section {
  background: linear-gradient(135deg, #eef2ff 0%, #f8f9fb 100%);
  padding: 3rem 1rem;
  display: flex;
  justify-content: center;
}

/* Card wrapper */
.profile-wrapper {
  background: #fff;
  width: 100%;
  max-width: 620px;
  padding: 2.5rem 2rem;
  border-radius: 16px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
  animation: fadeIn 0.5s ease-in-out;
}

/* Heading + subtext */
.profile-heading {
  text-align: center;
  font-size: 1.8rem;
  color: #1f0030;
  margin-bottom: 0.5rem;
  font-weight: 700;
}
.profile-subtext {
  text-align: center;
  color: #555;
  font-size: 0.95rem;
  margin-bottom: 2rem;
}

/* Form styles */
.profile-form {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.profile-form label {
  font-weight: 600;
  color: #333;
  font-size: 0.95rem;
  margin-bottom: 0.3rem;
  display: block;
}
.profile-form input,
.profile-form select,
.profile-form textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #d0d5dd;
  border-radius: 8px;
  font-size: 0.95rem;
  transition: border 0.2s ease, box-shadow 0.2s ease;
}
.profile-form input:focus,
.profile-form select:focus,
.profile-form textarea:focus {
  border-color: #6d28d9;
  box-shadow: 0 0 0 3px rgba(109, 40, 217, 0.15);
  outline: none;
}

/* Button */
.btn-primary {
  background: #6d28d9;
  color: #fff;
  border: none;
  padding: 0.8rem 1.2rem;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.25s ease, transform 0.2s ease;
}
.btn-primary:hover {
  background: #5b21b6;
  transform: translateY(-2px);
}

/* Animation */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Responsive */
@media (max-width: 600px) {
  .profile-wrapper {
    padding: 1.8rem 1.2rem;
  }
  .profile-heading {
    font-size: 1.5rem;
  }
}
</style>
{% endblock %}
